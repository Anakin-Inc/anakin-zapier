name: Promote to production

# Deliberately manual, not triggered by push/merge. `zapier promote`
# immediately affects every installed user -- Zapier's platform
# auto-migrates 100% of existing users to the promoted version, so
# this should always be a decision someone makes on purpose, not
# something that fires automatically.
#
# Requires a CHANGELOG.md entry for the version being promoted
# (Zapier's own CLI blocks promotion without one) -- see CHANGELOG.md
# for the expected format.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote (must already be pushed, e.g. 1.3.0)'
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Promote version
        run: npx zapier promote "${{ inputs.version }}"
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
