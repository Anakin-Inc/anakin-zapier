name: Validate

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # This repo has no test files yet (pre-existing, not introduced here) --
        # --passWithNoTests keeps CI green until real tests are added rather
        # than failing on an empty suite every single run.
        run: npx jest --testTimeout=60000 --detectOpenHandles --passWithNoTests

      - name: Validate Zapier integration
        run: npx zapier validate
